<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://raw.githubusercontent.com/failed555-tech/dgs-4/refs/heads/main/DGSicon.ico">
<title>DGS 5 V2.6.8</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Tomorrow', cursive;
    color: #ffffff;
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(180deg, #1e5799, #7db9e8);
    background-attachment: fixed;
}

.event {
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 35px;
    margin: 25px auto;
    max-width: 720px;
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(18px);
}

button {
    font-family: 'Tomorrow', cursive;
    background: linear-gradient(to bottom, #fefefe, #d7e7f7);
    border: 1px solid #6aa2d8;
    border-radius: 6px;
    padding: 10px 18px;
    margin: 6px;
    min-width: 140px;
    color: #1a1a1a;
    font-weight: 700;
    cursor: pointer;
}

button:hover{
    transform:scale(1.05);
}

hr {
    border: none;
    height: 1px;
    background: rgba(255,255,255,0.3);
}
</style>
</head>

<body>

<div class="event">
    <h1>Welcome to DGS</h1>
    <h2>The Ultimate Game Website</h2>
    <h4>DGS 5 V2.6.8</h4>
</div>

<div class="event">
    <h2>Game Collections</h2>
    <hr>
    <div id="collections">Loading games...</div>
</div>

<script>
const repoOwner = "failed555-tech";
const repoName = "DGS5json";

const collectionsDiv = document.getElementById("collections");

function createCategory(categoryName, games){

    const section = document.createElement("div");

    section.innerHTML = `
        <h3>${categoryName} Collection</h3>
        <hr>
    `;

    games.forEach(game=>{

        const button=document.createElement("button");

        button.textContent=game.title;

        button.onclick=()=>{

            const safePath=game.file
                .split("/")
                .map(part=>encodeURIComponent(part))
                .join("/");

            window.location.href=`https://${repoOwner}.github.io/${repoName}/${safePath}`;

        };

        section.appendChild(button);

    });

    collectionsDiv.appendChild(section);

}

async function loadGames(){

    try{

        const response=await fetch("games.json");

        if(!response.ok)
            throw new Error("Couldn't load games.json");

        const games=await response.json();

        collectionsDiv.innerHTML="";

        const categories={};

        games.forEach(game=>{

            if(!categories[game.category])
                categories[game.category]=[];

            categories[game.category].push(game);

        });

        Object.keys(categories)
            .sort()
            .forEach(category=>{

                createCategory(category,categories[category]);

            });

    }
    catch(err){

        console.error(err);
        collectionsDiv.innerHTML="<h3>Failed to load games.json</h3>";

    }

}

loadGames();
</script>

</body>
</html>
